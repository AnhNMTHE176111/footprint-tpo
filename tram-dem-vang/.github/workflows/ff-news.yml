name: Lịch tin Forex Factory

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ff-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tải lịch tin (giữ bản cũ nếu 429 hoặc lỗi)
        run: node .github/scripts/ff-fetch.mjs data/ff.json
      - name: Commit nếu nội dung đổi
        run: |
          if git status --porcelain data/ff.json | grep -q .; then
            git config user.name "ff-news[bot]"
            git config user.email "actions@users.noreply.github.com"
            git add data/ff.json
            git commit -m "Lịch tin Forex Factory $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main || true
            git push origin HEAD:main
          else
            echo "data/ff.json không đổi."
          fi
